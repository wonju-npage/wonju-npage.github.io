<!doctype html>
<html lang="ko">
<head>

<title>선 — 도시 산책자의 N페이지</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@400;700&amp;display=swap">
<style>
@font-face{font-family:'Chai Hwaljjak';src:url(assets/fonts/ChaiHwaljjak-Bold.otf) format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'SimKyungha';src:url(assets/fonts/SimKyungha.ttf) format('truetype');font-weight:400;font-display:swap}
body{margin:0;background:#ffffff}
a{color:#6b6c66;text-decoration:none}a:hover{color:#151613}
.item{background:none;border:none;padding:0;font:inherit;text-align:left;cursor:zoom-in;color:#151613}
.item .frame{transition:transform .25s ease,box-shadow .25s ease}
.item:hover .frame,.item:focus-visible .frame{transform:translateY(-6px);box-shadow:0 14px 28px rgba(21,22,19,.14)}

.item:hover .cap,.item:focus-visible .cap{color:#151613;font-weight:700}
.pg{background:none;border:none;font:inherit;color:#6b6c66;cursor:pointer;padding:12px 0;min-height:44px}
.pg:hover,.pg:focus-visible{color:#151613;text-decoration:underline;text-underline-offset:4px;outline:none}

.x:hover,.x:focus-visible{background:#f1efea;outline:none}

<style>
body{word-break:keep-all}

  footer > div > div:nth-child(2){flex-direction:column;gap:2px !important}
  footer > div > div:nth-child(2) > span{flex:none !important;white-space:normal !important}
}

</head>
<body>
<div id="root"></div>
<script>

class DCLogic {
  constructor(p){ this.props = p || {}; this.state = {}; }
  setState(s){ let ch=false; for (const k in s){ if (this.state[k] !== s[k]) ch=true; } Object.assign(this.state, s); if (ch && this.__mount) this.__mount(); }
  forceUpdate(){ if (this.__mount) this.__mount(); }
}
function __render(tplHtml, vals) {
  const tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
  const look = (p, scope) => {
    p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
    const segs = p.split('.'); let v = (segs[0] in scope) ? scope[segs[0]] : vals[segs[0]];
    for (const s of segs.slice(1)) v = v == null ? undefined : v[s]; return v;
  };
  const interp = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  const walk = (node, scope, out) => {
    for (const n of Array.from(node.childNodes)) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.textContent, scope))); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as');
        list.forEach((it, i) => walk(n.content || n, Object.assign({}, scope, { [as]: it, $index: i }), out)); continue;
      }
      if (tag === 'sc-if') { if (look(n.getAttribute('value').replace(/[{}]/g, ''), scope)) walk(n, scope, out); continue; }
      const el = n.cloneNode(false);
      for (const a of Array.from(n.attributes)) {
        if (!a.value.includes('{{')) continue;
        const whole = a.value.match(/^\{\{([^}]+)\}\}$/);
        if (a.name.startsWith('on')) {
          el.removeAttribute(a.name);
          const fn = whole ? look(whole[1], scope) : null;
          if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
          continue;
        }
        if (whole) { const v = look(whole[1], scope); if (v === false || v == null) { el.removeAttribute(a.name); continue; } if (v === true) { el.setAttribute(a.name, ''); continue; } }
        el.setAttribute(a.name, interp(a.value, scope));
      }
      walk(n, scope, el); out.appendChild(el);
    }
  };
  const frag = document.createDocumentFragment(); walk(tpl.content, {}, frag); return frag;
}
function __pathOf(el, root){ const p=[]; while (el && el !== root){ const par=el.parentNode; if(!par) return null; p.unshift(Array.prototype.indexOf.call(par.children, el)); el=par; } return el===root ? p : null; }
function __at(root, p){ let el=root; for (const i of p){ el = el && el.children[i]; } return el; }


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: null }; }
  renderVals() {
    const N = 10;
    const pad = (n) => String(n).padStart(2, '0');
    const o = this.state.open;
    const i = o === null ? 0 : o;
    return {
      people: Array.from({ length: N }, (_, k) => ({
        num: pad(k + 1),
        label: '참여자 ' + pad(k + 1) + '의 선 크게 보기',
        open: () => this.setState({ open: k })
      })),
      isOpen: o !== null,
      cur: { num: pad(i + 1), prevNum: pad(((i + N - 1) % N) + 1), nextNum: pad(((i + 1) % N) + 1) },
      close: () => this.setState({ open: null }),
      prev: () => this.setState({ open: (i + N - 1) % N }),
      next: () => this.setState({ open: (i + 1) % N })
    };
  }
}

const TPL = "\n\n<div style=\"min-height: 1400px; max-width: 1440px; margin: 0 auto; box-sizing: border-box; background: #ffffff; color: #151613; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif; padding: 24px 40px 64px; display: flex; flex-direction: column; gap: 56px; word-break: keep-all;\">\n  <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <a href=\"./\" style=\"font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px; color: #151613;\">도시 산책자의 N페이지</a>\n      <p style=\"margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6c66;\">원주에서 문장 좀 줍겠습니다 · 2026. 11. 14.</p>\n    </div>\n    <nav aria-label=\"아카이브\" style=\"display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; font-weight: 500; padding-top: 10px;\">\n      <a href=\"./\">홈</a>\n      <a href=\"shelf.html\">책장</a>\n      <a href=\"lines.html\" aria-current=\"page\" style=\"color: #151613; text-decoration: underline; text-underline-offset: 4px;\">선</a>\n      <a href=\"colors.html\">색</a>\n      <a href=\"sound-archive.html\">소리</a>\n      <a href=\"texts.html\">글</a>\n      <a href=\"about.html\">소개</a>\n    </nav>\n  </header>\n\n  <section aria-labelledby=\"h-lines\" style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1360px; width: 100%;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px;\">\n      <h1 id=\"h-lines\" style=\"margin: 0; font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 28px; line-height: 1.3; font-weight: 700;\">선</h1>\n      <p style=\"margin: 0; font-size: 15px; line-height: 24px; color: #6b6c66;\">가까이에서 하나, 멀리서 하나 — 종이에서 손을 떼지 않고 한 줄로 그린 골목의 선과, 그 선이 무엇을 닮았는지. 직유 · 담당 작가 민예원</p>\n    </div>\n    <p style=\"margin: 0; font-size: 13px; line-height: 18px; color: #6b6c66;\">누르면 근경 · 원경 두 장의 선과 문장이 함께 크게 펼쳐집니다.</p>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 80vw), 1fr)); gap: 36px 28px;\">\n      <sc-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"10\">\n        <button class=\"item\" type=\"button\" aria-label=\"{{p.label}}\" aria-haspopup=\"dialog\" onClick=\"{{p.open}}\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <span class=\"frame\" style=\"width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;\">\n            <span style=\"aspect-ratio: 4 / 3; box-sizing: border-box; background: #f1efea; border: 1px solid #e2e0da; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6b6c66;\">[근경]</span>\n            <span style=\"aspect-ratio: 4 / 3; box-sizing: border-box; background: #f1efea; border: 1px solid #e2e0da; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #6b6c66;\">[원경]</span>\n          </span>\n          <span class=\"cap\" style=\"font-size: 14px; line-height: 20px;\">참여자 {{p.num}}이 그린 선</span>\n        </button>\n      </sc-for>\n    </div>\n  </section>\n\n  <nav aria-label=\"이어서 보기\" style=\"display: flex; justify-content: space-between; max-width: 1360px; width: 100%; padding-top: 24px; border-top: 1px solid #e2e0da; font-size: 13px; font-weight: 500;\">\n    <a href=\"shelf.html\" style=\"padding: 12px 0;\">← 책장</a>\n    <a href=\"colors.html\" style=\"padding: 12px 0;\">색 →</a>\n  </nav>\n  <footer class=\"credit\" style=\"display: flex; flex-direction: column; gap: 8px; max-width: 1360px; width: 100%; padding-top: 20px; border-top: 1px solid #e2e0da; font-size: 12px; line-height: 18px; color: #6b6c66;\">\n    <p style=\"margin: 0;\">위 내용은 한국예술인복지재단에서 주최하는 2026년 예술로 협업사업의 일환으로 시행되었습니다.</p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; gap: 4px 24px;\"><span>주최│한국예술인복지재단</span><span>주관│바름책방</span><span>후원│문화체육관광부</span></p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;\"><span style=\"display: inline-flex; align-items: center; gap: 20px; padding: 4px 0;\"><img src=\"assets/logo-kawf.png\" alt=\"한국예술인복지재단\" style=\"display: block; height: 32px; width: auto;\"><img src=\"assets/logo-mcst.png\" alt=\"문화체육관광부\" style=\"display: block; height: 22px; width: auto;\"></span></p>\n    <p style=\"margin: 0;\">선 민예원 · 색 조순호 · 소리 김수진 · 글 이성미</p>\n  </footer>\n\n  <sc-if value=\"{{isOpen}}\">\n    <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-line\" style=\"position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box;\">\n      <button type=\"button\" aria-label=\"닫기\" onClick=\"{{close}}\" style=\"position: absolute; inset: 0; border: none; padding: 0; background: rgba(21, 22, 19, 0.72); cursor: zoom-out;\"></button>\n      <div style=\"position: relative; width: min(1200px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; background: #ffffff; padding: 40px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);\">\n        <h2 id=\"dlg-line\" style=\"margin: 0; padding-right: 48px; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.2px; color: #6b6c66;\">참여자 {{cur.num}} · [필명]의 직유</h2>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 32px 40px;\">\n          <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"aspect-ratio: 4 / 3; background: #f1efea; border: 1px solid #e2e0da; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-size: 13px; line-height: 18px; color: #6b6c66;\">[근경 — 손을 떼지 않고 한 줄로 그린 선]</div>\n            <figcaption style=\"font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.5; color: #6b6c66;\">[내가 그린 이 선은 ~을 닮았다 — 근경]</figcaption>\n          </figure>\n          <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"aspect-ratio: 4 / 3; background: #f1efea; border: 1px solid #e2e0da; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-size: 13px; line-height: 18px; color: #6b6c66;\">[원경 — 손을 떼지 않고 한 줄로 그린 선]</div>\n            <figcaption style=\"font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.5; color: #6b6c66;\">[내가 그린 이 선은 ~을 닮았다 — 원경]</figcaption>\n          </figure>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding-top: 16px; border-top: 1px solid #e2e0da; font-size: 13px; font-weight: 500;\">\n          <span style=\"font-size: 12px; line-height: 16px; font-weight: 400; color: #6b6c66;\">직유 · 담당 작가 민예원</span>\n          <a href=\"book.html#{{cur.num}}\" style=\"padding: 12px 0; font-weight: 600; color: #151613;\">이 사람의 책 펼치기 →</a>\n          <span style=\"display: flex; align-items: center; gap: 20px;\">\n            <button class=\"pg\" type=\"button\" onClick=\"{{prev}}\">← {{cur.prevNum}}</button>\n            <span aria-live=\"polite\" style=\"font-size: 12px; letter-spacing: 0.4px; color: #6b6c66;\">{{cur.num}} / 10</span>\n            <button class=\"pg\" type=\"button\" onClick=\"{{next}}\">{{cur.nextNum}} →</button>\n          </span>\n        </div>\n        <button class=\"x\" type=\"button\" aria-label=\"닫기\" onClick=\"{{close}}\" style=\"position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg>\n        </button>\n      </div>\n    </div>\n  </sc-if>\n</div>\n";
const c = new Component({});

const root = document.getElementById('root');
c.__mount = () => {
  const vals = c.renderVals();
  const ae = document.activeElement; const fp = (ae && root.contains(ae)) ? __pathOf(ae, root) : null;
  root.replaceChildren(__render(TPL, vals));
  if (fp) { const t = __at(root, fp); if (t && t.focus) t.focus({ preventScroll: true }); }
  
};
c.__mount();
</script>
</body>
