<script>

class DCLogic {
  constructor(p){ this.props = p || {}; this.state = {}; }
  setState(s){ let ch=false; for (const k in s){ if (this.state[k] !== s[k]) ch=true; } Object.assign(this.state, s); if (ch && this.__mount) this.__mount(); }
  forceUpdate(){ if (this.__mount) this.__mount(); }
}
function __render(tplHtml, vals) {
  const tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
  const look = (p, scope) => {
    p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
    const segs = p.split('.'); let v = (segs[0] in scope) ? scope[segs[0]] : vals[segs[0]];
    for (const s of segs.slice(1)) v = v == null ? undefined : v[s]; return v;
  };
  const interp = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  const walk = (node, scope, out) => {
    for (const n of Array.from(node.childNodes)) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.textContent, scope))); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as');
        list.forEach((it, i) => walk(n.content || n, Object.assign({}, scope, { [as]: it, $index: i }), out)); continue;
      }
      if (tag === 'sc-if') { if (look(n.getAttribute('value').replace(/[{}]/g, ''), scope)) walk(n, scope, out); continue; }
      const el = n.cloneNode(false);
      for (const a of Array.from(n.attributes)) {
        if (!a.value.includes('{{')) continue;
        const whole = a.value.match(/^\{\{([^}]+)\}\}$/);
        if (a.name.startsWith('on')) {
          el.removeAttribute(a.name);
          const fn = whole ? look(whole[1], scope) : null;
          if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
          continue;
        }
        if (whole) { const v = look(whole[1], scope); if (v === false || v == null) { el.removeAttribute(a.name); continue; } if (v === true) { el.setAttribute(a.name, ''); continue; } }
        el.setAttribute(a.name, interp(a.value, scope));
      }
      walk(n, scope, el); out.appendChild(el);
    }
  };
  const frag = document.createDocumentFragment(); walk(tpl.content, {}, frag); return frag;
}
function __pathOf(el, root){ const p=[]; while (el && el !== root){ const par=el.parentNode; if(!par) return null; p.unshift(Array.prototype.indexOf.call(par.children, el)); el=par; } return el===root ? p : null; }
function __at(root, p){ let el=root; for (const i of p){ el = el && el.children[i]; } return el; }


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: null, playing: false }; this._iv = null; this._from = null; }
  stopAudio() { clearInterval(this._iv); this._iv = null; if (window.NPA) window.NPA.stop(); const h = document.getElementById('npa-head'); if (h) h.style.opacity = '0'; }
  setOpen(i) {
    this.stopAudio();
    if (i !== null && this.state.open === null) this._from = i;
    document.documentElement.style.overflow = i === null ? '' : 'hidden';
    this.setState({ open: i, playing: false });
    if (i === null) { const b = document.querySelector('button.item[data-i="' + this._from + '"]'); if (b) b.focus({ preventScroll: true }); }
    else { const x = document.querySelector('.dlgbox .x'); if (x) x.focus({ preventScroll: true }); }
  }
  renderVals() {
    const P = window.NPAGE_PEOPLE || [];
    const N = P.length;
    const ROLES = [
      { name: '등장', color: '#4d6987' },
      { name: '사건', color: '#b5501f' },
      { name: '여운', color: '#76629a' }
    ];
    const fmt = (x) => { x = Math.round(x); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
    const TH = { '01': 837, '02': 847, '03': 842, '04': 840, '05': 802, '06': 810, '07': 835, '08': 804 };
    const alt = (q) => q.num + ' ' + q.name + '이(가) 녹음기 화면의 시간을 보며 손으로 적은 시간기록지. 등장 · 사건 · 여운 칸에 초와 들은 소리가 적혀 있다.';
    const { open, playing } = this.state;
    const people = P.map((q, i) => ({
      idx: i, num: q.num, name: q.name, title: q.title,
      thumb: 'assets/rec-' + q.num + '-s.jpg', th: TH[q.num] || 830, alt: alt(q),
      label: q.num + ' ' + q.name + ' · ' + q.title + ' — 시간기록과 1분 크게 보기',
      f0: q.sound.ev, f1: q.sound.yo - q.sound.ev, f2: q.sound.dur - q.sound.yo,
      open: () => this.setOpen(i)
    }));
    const i = open === null ? 0 : open;
    const q = P[i] || P[0];
    const S = q.sound;
    const roleAt = (t) => (t < S.ev ? 0 : t < S.yo ? 1 : 2);
    const pv = P[(i + N - 1) % N], nx = P[(i + 1) % N];
    return {
      people, n: N,
      isOpen: open !== null,
      cur: {
        num: q.num, name: q.name, title: q.title, rec: 'assets/rec-' + q.num + '.jpg', alt: alt(q),
        book: 'book.html#' + q.num,
        prevNum: pv.num, nextNum: nx.num,
        prevLabel: '이전: ' + pv.num + ' ' + pv.name, nextLabel: '다음: ' + nx.num + ' ' + nx.name,
        playing: playing, paused: !playing,
        playLabel: (playing ? '멈춤: ' : '듣기: ') + q.title + ' · ' + q.name,
        evT: fmt(S.ev), yoT: fmt(S.yo), durT: fmt(S.dur),
        bars: S.wave.map((v, k) => ({
          style: 'flex: 1; min-width: 2px; border-radius: 2px; height: ' + Math.max(4, Math.round(v * 48)) + 'px; background: ' + ROLES[roleAt((k + 0.5) / S.wave.length * S.dur)].color + ';'
        })),
        parts: ROLES.map((R, r) => {
          const has = !!(S.lines[r] && S.lines[r].trim());
          return {
            name: R.name, color: R.color,
            line: has ? S.lines[r] : '적힌 문장이 없습니다.',
            lineStyle: has
              ? "margin: 0; font-family: 'SimKyungha', 'Noto Sans KR', sans-serif; font-size: 22px; line-height: 1.6; color: #151613;"
              : 'margin: 0; font-size: 14px; line-height: 1.6; color: #6b6c66;'
          };
        })
      },
      close: () => this.setOpen(null),
      prev: () => this.setOpen((i + N - 1) % N),
      next: () => this.setOpen((i + 1) % N),
      togglePlay: () => {
        if (playing) { this.stopAudio(); this.setState({ playing: false }); return; }
        this.stopAudio();
        this.setState({ playing: true });
        const D = S.dur;
        window.NPA.play(S.src, 0, null, { onend: () => { this.stopAudio(); this.setState({ playing: false }); } });
        this._iv = setInterval(() => {
          const h = document.getElementById('npa-head'); const p = window.NPA.pos();
          if (h && p != null) { h.style.opacity = '1'; h.style.left = Math.min(100, p / D * 100).toFixed(2) + '%'; }
        }, 120);
      }
    };
  }
}

const TPL = "<div style=\"min-height: 1400px; max-width: 1440px; margin: 0 auto; box-sizing: border-box; background: #ffffff; color: #151613; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif; padding: 24px 40px 64px; display: flex; flex-direction: column; gap: 56px; word-break: keep-all;\">\n\n<header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <a href=\"./\" style=\"font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px; color: #151613;\"><img src=\"assets/icon.png\" alt=\"\" width=\"40\" height=\"40\" style=\"width: 40px; height: 40px; vertical-align: -8px; margin-right: 8px;\">도시 산책자의 N페이지</a>\n      <p style=\"margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6c66;\">원주에서 문장 좀 줍겠습니다 · 2026. 11. 14.</p>\n    </div>\n    <nav aria-label=\"아카이브\" style=\"display: flex; flex-wrap: wrap; gap: 26px; font-size: 15px; font-weight: 500; padding-top: 10px;\">\n      <a href=\"./\">홈</a>\n      <a href=\"shelf.html\">책장</a>\n      <a href=\"lines.html\">선</a>\n      <a href=\"colors.html\">색</a>\n      <a href=\"sound-archive.html\" aria-current=\"page\" style=\"color: #151613; text-decoration: underline; text-underline-offset: 4px;\">소리</a>\n      <a href=\"texts.html\">글</a>\n      <a href=\"about.html\">소개</a>\n    </nav>\n  </header>\n\n  <section aria-labelledby=\"h-snd\" style=\"display: flex; flex-direction: column; gap: 24px;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px;\">\n      <h1 id=\"h-snd\" style=\"margin: 0; font-family: 'Chai Hwaljjak', 'Noto Sans KR', sans-serif; font-size: 28px; line-height: 1.3; font-weight: 700;\">소리</h1>\n      <nav aria-label=\"소리 보기 방식\" style=\"display: flex; gap: 20px; font-size: 15px; line-height: 22px; font-weight: 600;\">\n        <a href=\"sound-archive.html\" aria-current=\"page\" style=\"color: #151613; padding: 10px 0; border-bottom: 2px solid #151613;\">여덟 명의 1분</a>\n        <a href=\"sound.html\" style=\"padding: 10px 0; border-bottom: 2px solid transparent;\">이어 듣기</a>\n      </nav>\n      <p style=\"margin: 0; font-size: 15px; line-height: 24px; color: #6b6c66;\">한 자리에서 녹음한 1분을 다시 들으며 소리가 바뀐 순간을 적고, 등장 · 사건 · 여운의 이야기로 썼습니다. 서사 · 담당 작가 김수진</p>\n    </div>\n    <p style=\"margin: 0; font-size: 13px; line-height: 18px; color: #6b6c66;\">누르면 손으로 적은 시간기록과 1분의 소리, 등장 · 사건 · 여운 문장이 함께 크게 펼쳐집니다.</p>\n    <div class=\"strips\">\n      <sc-for list=\"{{people}}\" as=\"p\">\n        <button class=\"item\" type=\"button\" aria-label=\"{{p.label}}\" aria-haspopup=\"dialog\" onClick=\"{{p.open}}\" data-i=\"{{p.idx}}\">\n          <img class=\"frame\" src=\"{{p.thumb}}\" alt=\"{{p.alt}}\" width=\"320\" height=\"{{p.th}}\" style=\"width: 100%; height: auto; box-sizing: border-box; border: 1px solid #e2e0da; background: #ffffff;\">\n          <span aria-hidden=\"true\" style=\"display: flex; height: 4px; gap: 2px;\">\n            <span style=\"flex: {{p.f0}}; background: #4d6987;\"></span>\n            <span style=\"flex: {{p.f1}}; background: #b5501f;\"></span>\n            <span style=\"flex: {{p.f2}}; background: #76629a;\"></span>\n          </span>\n          <span style=\"display: flex; flex-direction: column; gap: 2px;\">\n            <span style=\"font-size: 13px; line-height: 18px; font-weight: 600;\">{{p.num}} · {{p.name}}</span>\n            <span class=\"cap\" style=\"font-size: 12px; line-height: 18px;\">{{p.title}}</span>\n          </span>\n        </button>\n      </sc-for>\n    </div>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 12px; line-height: 18px; color: #6b6c66;\">\n      <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"width: 18px; height: 4px; background: #4d6987;\"></span>등장</span>\n      <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"width: 18px; height: 4px; background: #b5501f;\"></span>사건</span>\n      <span style=\"display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"width: 18px; height: 4px; background: #76629a;\"></span>여운</span>\n      <span>줄의 길이는 각자 고른 1분 안에서 세 구간이 차지한 시간입니다.</span>\n    </p>\n  </section>\n\n  <nav aria-label=\"이어서 보기\" style=\"display: flex; justify-content: space-between; padding-top: 24px; border-top: 1px solid #e2e0da; font-size: 13px; font-weight: 500;\">\n    <a href=\"colors.html\" style=\"padding: 12px 0;\">← 색</a>\n    <a href=\"sound.html\" style=\"padding: 12px 0;\">이어 듣기 →</a>\n  </nav>\n<footer class=\"credit\" style=\"display: flex; flex-direction: column; gap: 8px;  width: 100%; padding-top: 20px; border-top: 1px solid #e2e0da; font-size: 12px; line-height: 18px; color: #6b6c66;\">\n    <p style=\"margin: 0;\">위 내용은 한국예술인복지재단에서 주최하는 2026년 예술로 협업사업의 일환으로 시행되었습니다.</p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; gap: 4px 24px;\"><span>주최│한국예술인복지재단</span><span>주관│바름책방</span><span>후원│문화체육관광부</span></p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;\"><span style=\"display: inline-flex; align-items: center; gap: 20px; padding: 4px 0;\"><img src=\"assets/logo-kawf.png\" alt=\"한국예술인복지재단\" style=\"display: block; height: 32px; width: auto;\"><img src=\"assets/logo-mcst.png\" alt=\"문화체육관광부\" style=\"display: block; height: 22px; width: auto;\"></span></p>\n    <p style=\"margin: 0;\">선 민예원 · 색 조순호 · 소리 김수진 · 글 이성미 · 웹사이트 디자인 김수진</p>\n    <p style=\"margin: 0;\">© 2026 도시 산책자의 N페이지. 참여자의 선 · 색 · 소리 · 글은 각 참여자에게, 문장에서 옮긴 색은 조순호에게, 웹사이트 디자인은 김수진에게 저작권이 있습니다. 허락 없이 복제 · 배포할 수 없습니다. <a href=\"about.html#copyright\" style=\"text-decoration: underline; text-underline-offset: 3px;\">저작권 안내</a></p>\n  </footer>\n\n  <sc-if value=\"{{isOpen}}\">\n    <div class=\"dlgwrap\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dlg-snd\" style=\"position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box;\">\n      <button type=\"button\" aria-label=\"닫기\" tabindex=\"-1\" onClick=\"{{close}}\" style=\"position: absolute; inset: 0; border: none; padding: 0; background: rgba(21, 22, 19, 0.72); cursor: zoom-out;\"></button>\n      <div class=\"dlgbox\" style=\"position: relative; width: min(1100px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box; background: #ffffff; padding: 40px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);\">\n        <div class=\"dlg\">\n          <img class=\"ph\" src=\"{{cur.rec}}\" alt=\"{{cur.alt}}\" style=\"display: block; height: auto; box-sizing: border-box; border: 1px solid #e2e0da; background: #ffffff;\">\n          <div style=\"display: flex; flex-direction: column; gap: 28px; min-width: 0;\">\n            <h2 id=\"dlg-snd\" style=\"margin: 0; padding-right: 48px; font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0.2px; color: #6b6c66;\">{{cur.num}} · {{cur.name}}의 서사 · {{cur.title}}</h2>\n            <div style=\"display: flex; align-items: center; gap: 20px;\">\n              <button class=\"play\" type=\"button\" aria-label=\"{{cur.playLabel}}\" onClick=\"{{togglePlay}}\" style=\"width: 52px; height: 52px; border-radius: 50%; border: none; background: #151613; color: #ffffff; flex-shrink: 0; display: flex; align-items: center; justify-content: center;\">\n                <sc-if value=\"{{cur.playing}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 5h3.5v14H7zM13.5 5H17v14h-3.5z\" fill=\"currentColor\"></path></svg></sc-if>\n                <sc-if value=\"{{cur.paused}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5
