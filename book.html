class DCLogic {
  constructor(p){ this.props = p || {}; this.state = {}; }
  setState(s){ let ch=false; for (const k in s){ if (this.state[k] !== s[k]) ch=true; } Object.assign(this.state, s); if (ch && this.__mount) this.__mount(); }
  forceUpdate(){ if (this.__mount) this.__mount(); }
}
function __render(tplHtml, vals) {
  const tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
  const look = (p, scope) => {
    p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
    const segs = p.split('.'); let v = (segs[0] in scope) ? scope[segs[0]] : vals[segs[0]];
    for (const s of segs.slice(1)) v = v == null ? undefined : v[s]; return v;
  };
  const interp = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  const walk = (node, scope, out) => {
    for (const n of Array.from(node.childNodes)) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.textContent, scope))); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as');
        list.forEach((it, i) => walk(n.content || n, Object.assign({}, scope, { [as]: it, $index: i }), out)); continue;
      }
      if (tag === 'sc-if') { if (look(n.getAttribute('value').replace(/[{}]/g, ''), scope)) walk(n, scope, out); continue; }
      const el = n.cloneNode(false);
      for (const a of Array.from(n.attributes)) {
        if (!a.value.includes('{{')) continue;
        const whole = a.value.match(/^\{\{([^}]+)\}\}$/);
        if (a.name.startsWith('on')) {
          el.removeAttribute(a.name);
          const fn = whole ? look(whole[1], scope) : null;
          if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
          continue;
        }
        if (whole) { const v = look(whole[1], scope); if (v === false || v == null) { el.removeAttribute(a.name); continue; } if (v === true) { el.setAttribute(a.name, ''); continue; } }
        el.setAttribute(a.name, interp(a.value, scope));
      }
      walk(n, scope, el); out.appendChild(el);
    }
  };
  const frag = document.createDocumentFragment(); walk(tpl.content, {}, frag); return frag;
}
function __pathOf(el, root){ const p=[]; while (el && el !== root){ const par=el.parentNode; if(!par) return null; p.unshift(Array.prototype.indexOf.call(par.children, el)); el=par; } return el===root ? p : null; }
function __at(root, p){ let el=root; for (const i of p){ el = el && el.children[i]; } return el; }


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: 0 }; }
  renderVals() {
    const P = window.NPAGE_PEOPLE || [];
    const N = P.length;
    const pad = (n) => String(n).padStart(2, '0');
    const greys = ['#e4e1da', '#d9d7d1', '#cfccc4', '#c4c1b9', '#b9b6ae', '#aeaba3', '#a3a098', '#98958d', '#8d8a82', '#827f77'];
    const i = this.state.i;
    const go = (j) => () => {
      if (window.NPA) window.NPA.stop();
      this.setState({ i: j, sp: false });
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
    };
    const hide = 'visibility: hidden;';
    const q = P[i] || { name: '', title: '', lines: [{}, {}], sound: { lines: ['', '', ''], ev: 0, yo: 0, dur: 1 } };
    const S = q.sound || { lines: ['', '', ''], ev: 0, yo: 0, dur: 1 };
    const fmt = (x) => { x = Math.round(x); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
    const sp = !!this.state.sp;
    return {
      sPlaying: sp, sPaused: !sp, sLabel: sp ? '녹음 멈춤' : '녹음 듣기',
      sToggle: () => {
        if (sp) { window.NPA.stop(); this.setState({ sp: false }); return; }
        this.setState({ sp: true });
        window.NPA.play(S.src, 0, null, { onend: () => this.setState({ sp: false }) });
      },
      sf0: S.ev, sf1: S.yo - S.ev, sf2: S.dur - S.yo,
      sTimes: '사건 ' + fmt(S.ev) + ' · 여운 ' + fmt(S.yo), sEnd: fmt(S.dur),
      s1: S.lines[0] || '—', s2: S.lines[1] || '—', s3: S.lines[2] || '—',
      n: N,
      name: q.name, title: q.title,
      l1img: q.lines[0].img, l1text: q.lines[0].text, l2img: q.lines[1].img, l2text: q.lines[1].text,
      l1alt: q.name + ' · 근경 선 드로잉과 문장', l2alt: q.name + ' · 원경 선 드로잉과 문장',

      atEnd: i === N - 1,
      prevStyle: i === 0 ? hide : '',
      nextStyle: i === N - 1 ? hide : '',
      goPrev: go(Math.max(0, i - 1)),
      goNext: go(Math.min(N - 1, i + 1))
    };
  }
}

.5; color: #151613;\">{{l2text}}</span></figcaption>\n        </figure>\n      </div>\n      <p style=\"margin: 0; font-size: 12px; line-height: 16px; color: #6b6c66;\">담당 작가: 민예원</p>\n    </div>\n  </section>\n\n  <section aria-labelledby=\"h-color\" style=\"display: flex; flex-wrap: wrap; gap: 32px 48px; max-width: 1120px; width: 100%; margin: 0 auto; padding-top: 32px; border-top: 1px solid #e2e0da;\">\n    <div style=\"flex: 0 0 160px; display: flex; flex-direction: column; gap: 4px;\">\n      <h2 id=\"h-color\" style=\"margin: 0; font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 28px; line-height: 1.3; font-weight: 700;\">색</h2>\n      <span style=\"font-size: 13px; line-height: 18px; color: #6b6c66;\">은유 · {{name}}</span>\n    </div>\n    <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px;\">\n        <div style=\"flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px;\">\n          <div style=\"height: 200px; background: {{swatch}}; border: 1px solid #e2e0da;\"></div>\n          <span style=\"font-family: 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 18px; line-height: 1.4; color: #6b6c66;\">[색 이름]</span>\n        </div>\n        <div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 20px;\">\n          <div style=\"aspect-ratio: 4 / 3; background: #f1efea; border: 1px solid #e2e0da; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; font-size: 13px; line-height: 18px; color: #6b6c66;\">[색 페이지 사진 — 색 이름과 질감 단어]</div>\n          <p style=\"margin: 0; font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.5; color: #6b6c66;\">[이 색은 ~이다 — 은유 문장]</p>\n        </div>\n      </div>\n      <p style=\"margin: 0; font-size: 12px; line-height: 16px; color: #6b6c66;\">담 t: 1.5; color: #151613;\"><span style=\"font-family: 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; color: #4d6987; margin-right: 16px; vertical-align: middle;\">등장</span>{{s1}}</p>\n        <p style=\"margin: 0; font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.5; color: #151613;\"><span style=\"font-family: 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; color: #b5501f; margin-right: 16px; vertical-align: middle;\">사건</span>{{s2}}</p>\n        <p style=\"margin: 0; font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.5; color: #151613;\"><span style=\"font-family: 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; color: #76629a; margin-right: 16px; vertical-align: middle;\">여운</span>{{s3}}</p>\n      </div>\n      <p style=\"margin: 0; font-size: 12px; line-height: 16px; color: #6b6c66;\">담당 작가: 김수진</p>\n    </div>\n  </section>\n\n  <section aria-labelledby=\"h-text\" style=\"display: flex; flex-wrap: wrap; gap: 32px 48px; max-width: 1120px; width: 100%; margin: 0 auto; padding-top: 32px; border-top: 1px solid #e2e0da;\">\n    <div style=\"flex: 0 0 160px; display: flex; flex-direction: column; gap: 4px;\">\n      <h2 id=\"h-text\" style=\"margin: 0; font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 28px; line-height: 1.3; font-weight: 700;\">글</h2>\n      <span style=\"font-size: 13px; line-height: 18px; color: #6b6c66;\">모아 쓰기 · {{name}}</span>\n    </div>\n    <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px;\">\n      <p style=\"margin: 0; max-width: 640px; font-family: 'SimKyungha', 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 26px; line-height: 1.8; color: #6b6c66;\">[마지막 글 — 앞에 쓴 문장 중 가장 마
