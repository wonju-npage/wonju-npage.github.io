<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소리 · 이어 듣기 — 도시 산책자의 N페이지</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
@font-face{font-family:'Chai Hwaljjak';src:url(assets/fonts/ChaiHwaljjak-Bold.otf) format('opentype');font-weight:700;font-display:swap}
body{margin:0;background:#0e0f12}
a{color:#8d8f86;text-decoration:none}a:hover{color:#ecebe5}
.chip{font:inherit;cursor:pointer;transition:background .25s,box-shadow .25s,color .25s}
.chip:hover,.chip:focus-visible{border-color:#ecebe5 !important;outline:none}
.txtbtn{background:none;border:none;color:#ecebe5;font:inherit;cursor:pointer;padding:12px 4px}
.txtbtn:hover{text-decoration:underline}
</style>
<style>
body{word-break:keep-all}
#root > *{max-width:1440px;margin-left:auto;margin-right:auto}
@media (max-width:640px){
  h1{font-size:30px !important;line-height:1.2 !important}
  main > div:has(> div > button.win){gap:8px !important;width:100%}
  main > div:has(> div > button.win) > span:last-child{display:none}
  div:has(> button.win){gap:5px !important;flex:1;min-width:0}
  button.win{width:auto !important;flex:1;min-width:0;height:56px !important}
  main > div:has(> div > button.chip){grid-template-columns:1fr !important;gap:8px !important}
  main > div:has(> div > button.chip) > span{padding-top:0 !important}
  button.chip{padding:8px 12px !important;font-size:14px !important;min-height:44px}
  footer > div > div:nth-child(2){flex-direction:column;gap:2px !important}
  footer > div > div:nth-child(2) > span{flex:none !important;white-space:normal !important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>

class DCLogic {
  constructor(p){ this.props = p || {}; this.state = {}; }
  setState(s){ let ch=false; for (const k in s){ if (this.state[k] !== s[k]) ch=true; } Object.assign(this.state, s); if (ch && this.__mount) this.__mount(); }
  forceUpdate(){ if (this.__mount) this.__mount(); }
}
function __render(tplHtml, vals) {
  const tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
  const look = (p, scope) => {
    p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
    const segs = p.split('.'); let v = (segs[0] in scope) ? scope[segs[0]] : vals[segs[0]];
    for (const s of segs.slice(1)) v = v == null ? undefined : v[s]; return v;
  };
  const interp = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  const walk = (node, scope, out) => {
    for (const n of Array.from(node.childNodes)) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.textContent, scope))); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as');
        list.forEach((it, i) => walk(n.content || n, Object.assign({}, scope, { [as]: it, $index: i }), out)); continue;
      }
      if (tag === 'sc-if') { if (look(n.getAttribute('value').replace(/[{}]/g, ''), scope)) walk(n, scope, out); continue; }
      const el = n.cloneNode(false);
      for (const a of Array.from(n.attributes)) {
        if (!a.value.includes('{{')) continue;
        const whole = a.value.match(/^\{\{([^}]+)\}\}$/);
        if (a.name.startsWith('on')) {
          el.removeAttribute(a.name);
          const fn = whole ? look(whole[1], scope) : null;
          if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
          continue;
        }
        if (whole) { const v = look(whole[1], scope); if (v === false || v == null) { el.removeAttribute(a.name); continue; } if (v === true) { el.setAttribute(a.name, ''); continue; } }
        el.setAttribute(a.name, interp(a.value, scope));
      }
      walk(n, scope, el); out.appendChild(el);
    }
  };
  const frag = document.createDocumentFragment(); walk(tpl.content, {}, frag); return frag;
}
function __pathOf(el, root){ const p=[]; while (el && el !== root){ const par=el.parentNode; if(!par) return null; p.unshift(Array.prototype.indexOf.call(par.children, el)); el=par; } return el===root ? p : null; }
function __at(root, p){ let el=root; for (const i of p){ el = el && el.children[i]; } return el; }


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: [2, 6, 0], focus: 1, playing: false }; }
  renderVals() {
    const ROLES = [
      { name: '등장', color: '#8fb0d6', glow: '0 0 18px #8fb0d699', len: 20,
        words: Array.from({ length: 10 }, (_, i) => '[단어 ' + String(i + 1).padStart(2, '0') + ']') },
      { name: '사건', color: '#ff9a5c', glow: '0 0 18px #ff9a5c99', len: 14,
        words: Array.from({ length: 10 }, (_, i) => '[단어 ' + String(i + 1).padStart(2, '0') + ']') },
      { name: '여운', color: '#c2aee6', glow: '0 0 18px #c2aee699', len: 26,
        words: Array.from({ length: 10 }, (_, i) => '[단어 ' + String(i + 1).padStart(2, '0') + ']') }
    ];
    const { sel, focus, playing } = this.state;
    const pad = (n) => String(n).padStart(2, '0');
    const rows = ROLES.map((R, r) => ({
      name: R.name, color: R.color,
      items: R.words.map((w, i) => {
        const on = sel[r] === i;
        return {
          word: w, on: on ? 'true' : 'false',
          label: R.name + ' · ' + w,
          style: 'min-height: 44px; padding: 10px 16px; border-radius: 22px; font-size: 15px; line-height: 22px; font-weight: ' + (on ? '700' : '500') + '; border: 1px solid ' + (on ? R.color : '#2c2e33') + '; background: ' + (on ? R.color : '#17191d') + '; color: ' + (on ? '#0e0f12' : '#d6d5cd') + '; box-shadow: ' + (on ? R.glow : 'none') + ';',
          pick: () => { const s = sel.slice(); s[r] = i; this.setState({ sel: s, focus: r, playing: true }); }
        };
      })
    }));
    const segs = ROLES.map((R, r) => ({
      word: R.words[sel[r]], who: '참여자 ' + pad(sel[r] + 1),
      bar: 'flex: ' + R.len + '; background: ' + R.color + '; opacity: ' + (r <= focus ? 1 : 0.25) + ';',
      cap: 'flex: ' + R.len + '; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: ' + R.color + '; opacity: ' + (r === focus ? 1 : 0.6) + ';'
    }));
    return {
      rows, segs,
      playing: playing, paused: !playing,
      playLabel: playing ? '멈춤' : '이어 듣기',
      togglePlay: () => this.setState({ playing: !playing }),
      shuffle: () => this.setState({ sel: [0, 1, 2].map(() => Math.floor(Math.random() * 10)), focus: 0, playing: true })
    };
  }
}

const TPL = "\n\n<div style=\"min-height: 900px; max-width: 1440px; margin: 0 auto; box-sizing: border-box; background: #0e0f12; color: #ecebe5; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif; padding: 24px 40px 40px; display: flex; flex-direction: column; gap: 32px; word-break: keep-all;\">\n\n  <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <a href=\"./\" style=\"font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px; color: #ecebe5;\">도시 산책자의 N페이지</a>\n      <p style=\"margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #8d8f86;\">원주에서 문장 좀 줍겠습니다 · 2026. 11. 14.</p>\n    </div>\n    <nav aria-label=\"아카이브\" style=\"display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; font-weight: 500; padding-top: 10px;\">\n      <a href=\"./\">홈</a>\n      <a href=\"shelf.html\">책장</a>\n      <a href=\"lines.html\">선</a>\n      <a href=\"colors.html\">색</a>\n      <a href=\"sound-archive.html\" aria-current=\"page\" style=\"color: #ecebe5; text-decoration: underline; text-underline-offset: 4px;\">소리</a>\n      <a href=\"texts.html\">글</a>\n      <a href=\"about.html\">소개</a>\n    </nav>\n  </header>\n\n  <nav aria-label=\"소리 보기 방식\" style=\"display: flex; gap: 24px; font-size: 15px; line-height: 22px; font-weight: 600;\">\n    <a href=\"sound-archive.html\" style=\"padding: 10px 0; border-bottom: 2px solid transparent;\">열 명의 1분</a>\n    <a href=\"sound.html\" aria-current=\"page\" style=\"color: #ecebe5; padding: 10px 0; border-bottom: 2px solid #ecebe5;\">이어 듣기</a>\n  </nav>\n\n  <main style=\"flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px; max-width: 1120px; width: 100%; margin: 0 auto;\">\n    <p style=\"margin: 0; font-size: 15px; line-height: 24px; color: #c9c8c0; text-align: center;\">줄마다 단어 하나를 골라, 세 사람의 소리로 나만의 1분을 이어 보세요.</p>\n    <sc-for list=\"{{rows}}\" as=\"row\" hint-placeholder-count=\"3\">\n      <div style=\"display: grid; grid-template-columns: 56px 1fr; gap: 16px; align-items: start;\">\n        <span style=\"padding-top: 11px; font-size: 14px; line-height: 20px; font-weight: 700; color: {{row.color}};\">{{row.name}}</span>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n          <sc-for list=\"{{row.items}}\" as=\"it\" hint-placeholder-count=\"10\">\n            <button class=\"chip\" type=\"button\" aria-label=\"{{it.label}}\" aria-pressed=\"{{it.on}}\" onClick=\"{{it.pick}}\" style=\"{{it.style}}\">{{it.word}}</button>\n          </sc-for>\n        </div>\n      </div>\n    </sc-for>\n  </main>\n\n  <footer style=\"display: flex; align-items: center; gap: 24px; max-width: 1120px; width: 100%; margin: 0 auto;\">\n    <button type=\"button\" aria-label=\"{{playLabel}}\" onClick=\"{{togglePlay}}\" style=\"width: 56px; height: 56px; border-radius: 50%; border: none; background: #ecebe5; color: #0e0f12; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;\">\n      <sc-if value=\"{{playing}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 5h3.5v14H7zM13.5 5H17v14h-3.5z\" fill=\"currentColor\"></path></svg></sc-if>\n      <sc-if value=\"{{paused}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5l11 7-11 7z\" fill=\"currentColor\"></path></svg></sc-if>\n    </button>\n    <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0;\">\n      <div style=\"display: flex; height: 4px; gap: 4px;\">\n        <sc-for list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"3\">\n          <span style=\"{{g.bar}}\"></span>\n        </sc-for>\n      </div>\n      <div style=\"display: flex; gap: 4px; font-size: 12px; line-height: 16px;\">\n        <sc-for list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"3\">\n          <span style=\"{{g.cap}}\">{{g.word}} · <span style=\"color: #8d8f86;\">{{g.who}}</span></span>\n        </sc-for>\n      </div>\n    </div>\n    <button class=\"txtbtn\" type=\"button\" onClick=\"{{shuffle}}\" style=\"font-size: 13px; font-weight: 500; flex-shrink: 0;\">섞기</button>\n  </footer>\n\n  <nav aria-label=\"이어서 보기\" style=\"display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid #2c2e33; font-size: 13px; font-weight: 500;\">\n    <a href=\"sound-archive.html\" style=\"padding: 12px 0;\">← 열 명의 1분</a>\n    <a href=\"texts.html\" style=\"padding: 12px 0;\">글 →</a>\n  </nav>\n  <footer class=\"credit\" style=\"display: flex; flex-direction: column; gap: 8px; margin: 8px -40px -40px; padding: 28px 40px 36px; background: #ffffff; box-shadow: 0 0 0 100vmax #ffffff; clip-path: inset(0 -100vmax); font-size: 12px; line-height: 18px; color: #6b6c66;\">\n    <p style=\"margin: 0;\">위 내용은 한국예술인복지재단에서 주최하는 2026년 예술로 협업사업의 일환으로 시행되었습니다.</p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; gap: 4px 24px;\"><span>주최│한국예술인복지재단</span><span>주관│바름책방</span><span>후원│문화체육관광부</span></p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;\"><span style=\"display: inline-flex; align-items: center; gap: 20px; padding: 4px 0;\"><img src=\"assets/logo-kawf.png\" alt=\"한국예술인복지재단\" style=\"display: block; height: 32px; width: auto;\"><img src=\"assets/logo-mcst.png\" alt=\"문화체육관광부\" style=\"display: block; height: 22px; width: auto;\"></span></p>\n    <p style=\"margin: 0;\">선 민예원 · 색 조순호 · 소리 김수진 · 글 이성미</p>\n  </footer>\n</div>\n";
const c = new Component({});

const root = document.getElementById('root');
c.__mount = () => {
  const vals = c.renderVals();
  const ae = document.activeElement; const fp = (ae && root.contains(ae)) ? __pathOf(ae, root) : null;
  root.replaceChildren(__render(TPL, vals));
  if (fp) { const t = __at(root, fp); if (t && t.focus) t.focus({ preventScroll: true }); }
  
};
c.__mount();
</script>
</body>
</html>
