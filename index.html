<style>
:root{--ink:#fdfaee;--dim:#d8d4c6;--bg:#0e0f12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Noto Sans CJK KR',system-ui,sans-serif}
a{color:var(--ink);text-decoration:none}
.hero{position:relative;height:100vh;height:100svh;min-height:600px;overflow:hidden}
.hero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:brightness(.86)}
.top{position:absolute;top:0;left:0;right:0;padding:24px 40px;display:flex;justify-content:space-between;align-items:center}
.badge{margin:0;padding:8px 12px;background:rgba(14,15,18,.62);font-size:13px;line-height:18px;font-weight:500;letter-spacing:.2px}
.mark{position:absolute;top:0;left:0;right:0;bottom:150px;display:flex;align-items:center;justify-content:center;padding:80px 24px 8px}
.mark h1{margin:0;width:min(660px,92vw);height:100%;display:flex;align-items:center;justify-content:center}
.mark img{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
.band{position:absolute;left:0;right:0;bottom:0;height:72px;background:rgba(14,15,18,.74);border-top:2px solid var(--ink)}
nav{position:absolute;left:0;right:0;bottom:0;padding:0 40px;display:flex;justify-content:space-evenly;align-items:flex-end;gap:16px}
.obj{display:flex;flex-direction:column;align-items:center;min-width:44px;transition:transform .25s ease}
.obj svg{display:block;height:var(--h);width:auto}
.obj svg path{fill:currentColor}
.obj:hover,.obj:focus-visible{transform:translateY(-8px);outline:none}
.obj:hover .lbl,.obj:focus-visible .lbl{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.cap{height:72px;padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lbl{font-size:15px;line-height:20px;font-weight:600}
.sub{font-size:11px;line-height:16px;color:var(--dim)}
.about{word-break:keep-all;max-width:640px;margin:0 auto;padding:72px 24px 40px;line-height:1.85;font-size:16px}
.about h2{font-size:20px;font-weight:600;margin:0 0 16px}
.about p{margin:0 0 14px;color:#e9e5d8}
.soon{margin-top:28px;padding:16px 18px;border:1.5px solid var(--ink);font-size:15px}
footer{max-width:640px;margin:0 auto;padding:24px 24px 56px;font-size:12px;color:#9c988c}
@media (max-width:640px){
  .top{padding:16px}
  .badge{font-size:12px}
  .mark{bottom:120px;padding:64px 16px 8px}
  .band{height:56px}
  nav{padding:0 12px;justify-content:space-between;gap:0}
  .obj svg{height:calc(var(--h) * .625)}
  .obj:hover,.obj:focus-visible{transform:none}
  .cap{height:56px;padding-top:16px}
  .lbl{font-size:13px;line-height:18px}
  .sub{display:none}
  .about{padding:56px 20px 32px;font-size:15px}
}
</style>
