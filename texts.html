<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 — 도시 산책자의 N페이지</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400;700&amp;display=swap">
<style>
@font-face{font-family:'Chai Hwaljjak';src:url(assets/fonts/ChaiHwaljjak-Bold.otf) format('opentype');font-weight:700;font-display:swap}
body{margin:0;background:#ffffff}
a{color:#6b6c66;text-decoration:none}a:hover{color:#151613}
.card:hover .open,.card:focus-visible .open{text-decoration:underline;text-underline-offset:4px}
</style>
<style>
body{word-break:keep-all}
#root > *{max-width:1440px;margin-left:auto;margin-right:auto}
@media (max-width:640px){
  h1{font-size:30px !important;line-height:1.2 !important}
  main > div:has(> div > button.win){gap:8px !important;width:100%}
  main > div:has(> div > button.win) > span:last-child{display:none}
  div:has(> button.win){gap:5px !important;flex:1;min-width:0}
  button.win{width:auto !important;flex:1;min-width:0;height:56px !important}
  main > div:has(> div > button.chip){grid-template-columns:1fr !important;gap:8px !important}
  main > div:has(> div > button.chip) > span{padding-top:0 !important}
  button.chip{padding:8px 12px !important;font-size:14px !important;min-height:44px}
  footer > div > div:nth-child(2){flex-direction:column;gap:2px !important}
  footer > div > div:nth-child(2) > span{flex:none !important;white-space:normal !important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>

class DCLogic {
  constructor(p){ this.props = p || {}; this.state = {}; }
  setState(s){ let ch=false; for (const k in s){ if (this.state[k] !== s[k]) ch=true; } Object.assign(this.state, s); if (ch && this.__mount) this.__mount(); }
  forceUpdate(){ if (this.__mount) this.__mount(); }
}
function __render(tplHtml, vals) {
  const tpl = document.createElement('template'); tpl.innerHTML = tplHtml;
  const look = (p, scope) => {
    p = p.trim(); if (p === 'true') return true; if (p === 'false') return false;
    const segs = p.split('.'); let v = (segs[0] in scope) ? scope[segs[0]] : vals[segs[0]];
    for (const s of segs.slice(1)) v = v == null ? undefined : v[s]; return v;
  };
  const interp = (str, scope) => str.replace(/\{\{([^}]+)\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });
  const walk = (node, scope, out) => {
    for (const n of Array.from(node.childNodes)) {
      if (n.nodeType === 3) { out.appendChild(document.createTextNode(interp(n.textContent, scope))); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(n.getAttribute('list').replace(/[{}]/g, ''), scope) || []; const as = n.getAttribute('as');
        list.forEach((it, i) => walk(n.content || n, Object.assign({}, scope, { [as]: it, $index: i }), out)); continue;
      }
      if (tag === 'sc-if') { if (look(n.getAttribute('value').replace(/[{}]/g, ''), scope)) walk(n, scope, out); continue; }
      const el = n.cloneNode(false);
      for (const a of Array.from(n.attributes)) {
        if (!a.value.includes('{{')) continue;
        const whole = a.value.match(/^\{\{([^}]+)\}\}$/);
        if (a.name.startsWith('on')) {
          el.removeAttribute(a.name);
          const fn = whole ? look(whole[1], scope) : null;
          if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn);
          continue;
        }
        if (whole) { const v = look(whole[1], scope); if (v === false || v == null) { el.removeAttribute(a.name); continue; } if (v === true) { el.setAttribute(a.name, ''); continue; } }
        el.setAttribute(a.name, interp(a.value, scope));
      }
      walk(n, scope, el); out.appendChild(el);
    }
  };
  const frag = document.createDocumentFragment(); walk(tpl.content, {}, frag); return frag;
}
function __pathOf(el, root){ const p=[]; while (el && el !== root){ const par=el.parentNode; if(!par) return null; p.unshift(Array.prototype.indexOf.call(par.children, el)); el=par; } return el===root ? p : null; }
function __at(root, p){ let el=root; for (const i of p){ el = el && el.children[i]; } return el; }


class Component extends DCLogic {
  renderVals() {
    const pad = (n) => String(n).padStart(2, '0');
    return { people: Array.from({ length: 10 }, (_, i) => ({ num: pad(i + 1), label: '참여자 ' + pad(i + 1) + '의 글 — 책 펼치기' })) };
  }
}

const TPL = "\n\n<div style=\"min-height: 1200px; box-sizing: border-box; background: #ffffff; color: #151613; font-family: 'Noto Sans KR', 'Noto Sans CJK KR', system-ui, sans-serif; padding: 24px 40px 64px; display: flex; flex-direction: column; gap: 56px;\">\n  <header style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n      <a href=\"./\" style=\"font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.5px; color: #151613;\">도시 산책자의 N페이지</a>\n      <p style=\"margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; color: #6b6c66;\">원주에서 문장 좀 줍겠습니다 · 2026. 11. 14.</p>\n    </div>\n    <nav aria-label=\"아카이브\" style=\"display: flex; flex-wrap: wrap; gap: 24px; font-size: 13px; font-weight: 500; padding-top: 10px;\">\n      <a href=\"./\">홈</a>\n      <a href=\"shelf.html\">책장</a>\n      <a href=\"lines.html\">선</a>\n      <a href=\"colors.html\">색</a>\n      <a href=\"sound.html\">소리</a>\n      <a href=\"texts.html\" aria-current=\"page\" style=\"color: #151613; text-decoration: underline; text-underline-offset: 4px;\">글</a>\n    </nav>\n  </header>\n\n  <section aria-labelledby=\"h-texts\" style=\"display: flex; flex-direction: column; gap: 24px; max-width: 1360px; width: 100%;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px;\">\n      <h1 id=\"h-texts\" style=\"margin: 0; font-family: 'Chai Hwaljjak', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; font-size: 28px; line-height: 1.3; font-weight: 700;\">글</h1>\n      <p style=\"margin: 0; font-size: 15px; line-height: 24px; color: #6b6c66;\">선 · 색 · 소리에서 주운 문장을 모아 쓴 열 편의 짧은 글. 모아 쓰기 · 담당 작가 이성미</p>\n    </div>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(380px, 80vw), 1fr)); gap: 48px 56px;\">\n      <sc-for list=\"{{people}}\" as=\"p\" hint-placeholder-count=\"10\">\n        <a class=\"card\" href=\"book.html#{{p.num}}\" aria-label=\"{{p.label}}\" style=\"display: flex; flex-direction: column; gap: 14px; padding-top: 16px; border-top: 1px solid #e2e0da; color: #151613;\">\n          <span style=\"font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.2px; color: #6b6c66;\">참여자 {{p.num}}</span>\n          <span style=\"font-family: 'Noto Serif KR', 'Noto Serif CJK KR', serif; font-size: 18px; line-height: 1.8; letter-spacing: -0.2px; color: #6b6c66;\">[마지막 글 — 선 · 색 · 소리에서 주운 문장을 모아 쓴 짧은 글 한 편]</span>\n          <span class=\"open\" style=\"font-size: 13px; line-height: 18px; font-weight: 500; color: #151613;\">책 펼치기 →</span>\n        </a>\n      </sc-for>\n    </div>\n  </section>\n\n  <nav aria-label=\"이어서 보기\" style=\"display: flex; justify-content: space-between; max-width: 1360px; width: 100%; padding-top: 24px; border-top: 1px solid #e2e0da; font-size: 13px; font-weight: 500;\">\n    <a href=\"sound-archive.html\" style=\"padding: 12px 0;\">← 소리</a>\n    <a href=\"shelf.html\" style=\"padding: 12px 0;\">책장으로 →</a>\n  </nav>\n  <footer class=\"credit\" style=\"display: flex; flex-direction: column; gap: 8px; max-width: 1360px; width: 100%; padding-top: 20px; border-top: 1px solid #e2e0da; font-size: 12px; line-height: 18px; color: #6b6c66;\">\n    <p style=\"margin: 0;\">위 내용은 한국예술인복지재단에서 주최하는 2026년 예술로 협업사업의 일환으로 시행되었습니다.</p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; gap: 4px 24px;\"><span>주최│한국예술인복지재단</span><span>주관│바름책방</span><span>후원│문화체육관광부</span></p>\n    <p style=\"margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px;\"><span style=\"display: inline-flex; align-items: center; gap: 20px; padding: 4px 0;\"><img src=\"assets/logo-kawf.png\" alt=\"한국예술인복지재단\" style=\"display: block; height: 32px; width: auto;\"><img src=\"assets/logo-mcst.png\" alt=\"문화체육관광부\" style=\"display: block; height: 22px; width: auto;\"></span></p>\n    <p style=\"margin: 0;\">선 민예원 · 색 조순호 · 소리 김수진 · 글 이성미</p>\n  </footer>\n</div>\n";
const c = new Component({});

const root = document.getElementById('root');
c.__mount = () => {
  const vals = c.renderVals();
  const ae = document.activeElement; const fp = (ae && root.contains(ae)) ? __pathOf(ae, root) : null;
  root.replaceChildren(__render(TPL, vals));
  if (fp) { const t = __at(root, fp); if (t && t.focus) t.focus({ preventScroll: true }); }
  
};
c.__mount();
</script>
</body>
</html>
